    <meta name="color-scheme" content="light dark" />
    <script>
      try {
        var t = localStorage.getItem('theme');
        if (t !== 'dark' && t !== 'light') t = matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
        document.documentElement.setAttribute('data-theme', t);
      } catch (e) {}
    </script>
